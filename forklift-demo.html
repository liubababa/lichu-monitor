<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>旭日东明站 · 厂房门口叉车造型对照（本地演示页，未部署）</title>
<link rel="icon" href="data:,">
<style>
  /* 本地评审页：不依赖 css/style.css；按 4K 大屏手点设计，可点元素 min-height 46px */
  :root { --cy: #2ee6c8; --line: rgba(140,170,185,.24); --txt: #cfe8e4; --dim: #7fa8a2; --pw: 420px; }
  html, body { margin: 0; height: 100%; background: #050b0d; overflow: hidden; color: var(--txt);
    font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
  #stage { position: absolute; left: 0; top: 0; bottom: 0; right: var(--pw); }
  body.nopanel #stage { right: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  #panel { position: absolute; right: 0; top: 0; bottom: 0; width: var(--pw); z-index: 20; overflow-y: auto;
    background: linear-gradient(165deg, rgba(7,22,24,.96), rgba(4,11,13,.94));
    border-left: 1px solid rgba(46,230,200,.4); padding: 14px 16px 22px; }
  body.nopanel #panel { display: none; }
  #panel h1 { font-size: 15px; color: var(--cy); margin: 0 0 4px; letter-spacing: .04em; font-weight: 600; }
  .hint { font-size: 11.5px; color: var(--dim); line-height: 1.7; margin: 0 0 10px; }
  .grp { border-top: 1px solid rgba(140,170,185,.16); padding: 11px 0 2px; }
  .grp > h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #a9bdc6;
    margin: 0 0 8px; font-weight: 600; }
  .rows { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .rows.c3 { grid-template-columns: repeat(3, 1fr); }
  .rows.c4 { grid-template-columns: repeat(4, 1fr); }
  button { min-height: 46px; padding: 6px 8px; font: inherit; font-size: 12.5px; color: #dfeeea; cursor: pointer;
    background: rgba(20,44,48,.6); border: 1px solid var(--line); border-radius: 3px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  button small { font-size: 10.5px; color: var(--dim); }
  button.on { background: var(--cy); color: #04231d; border-color: var(--cy); font-weight: 600; }
  button.on small { color: rgba(4,35,29,.72); }
  #desc { font-size: 12px; line-height: 1.75; color: #bcd6d2; background: rgba(10,26,30,.7);
    border: 1px solid var(--line); border-left: 2px solid var(--cy); padding: 9px 11px; margin: 10px 0 0; }
  #desc b { color: #eafffa; }
  #desc ul { margin: 5px 0 0; padding-left: 16px; }
  #desc li { margin: 2px 0; }
  #err { position: absolute; left: 12px; top: 12px; z-index: 40; color: #ff8a6a; font-size: 13px; }
  #badge { position: absolute; left: 14px; bottom: 12px; z-index: 15; font-size: 12.5px; color: var(--dim);
    letter-spacing: .06em; pointer-events: none; }
  #badge b { color: var(--cy); font-size: 15px; letter-spacing: .1em; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="err"></div>
<div id="badge"><b id="badgeOpt">方案2</b> <span id="badgeSub">电动平衡重 · 夜间</span></div>
<div id="panel">
  <h1>厂房门口叉车 · 造型对照</h1>
  <p class="hint">旭日东明站（高特）三维页：厂房装卸货台门前那条车道。尺寸按真实米制 ——
    参照人 1.4 m、货台面 .32 m、大门洞 3.6×2.2 m。灯光/泛光/曝光走 js/scene-preset.js 同一套，
    所以这里的观感就等于线上观感。可拖动画面转视角。</p>

  <div class="grp"><h2>方案</h2><div class="rows c3" id="optRows"></div></div>
  <div class="grp"><h2>机位</h2><div class="rows c3" id="camRows"></div></div>
  <div class="grp"><h2>环境</h2><div class="rows c3" id="envRows"></div></div>
  <div id="desc"></div>
</div>

<script>
/* 依赖仓库里已有的 libs/ 与 js/scene-preset.js，不新增库；带时间戳不吃缓存 */
(function () {
  var V = '?v=' + Date.now();
  var FILES = ['libs/three.min.js', 'libs/OrbitControls.js',
    'libs/CopyShader.js', 'libs/LuminosityHighPassShader.js', 'libs/EffectComposer.js',
    'libs/RenderPass.js', 'libs/ShaderPass.js', 'libs/UnrealBloomPass.js',
    'js/scene-preset.js'];
  var i = 0;
  function next() {
    if (i >= FILES.length) { try { start(); } catch (e) {
      document.getElementById('err').textContent = '启动出错：' + e.message; throw e; } return; }
    var s = document.createElement('script');
    s.src = FILES[i++] + V;
    s.onload = next;
    s.onerror = function () { document.getElementById('err').textContent = '依赖加载失败：' + s.src; };
    document.head.appendChild(s);
  }
  next();

  function start() {
    var T = window.THREE, SP = window.ScenePreset;
    if (!T) { document.getElementById('err').textContent = 'THREE 未就绪'; return; }

    /* ---------------- 状态（深链：?opt=2&cam=near&theme=day&anim=0&lift=.3&mix=1&nopanel=1） ----- */
    var state = { opt: '2', cam: 'near', theme: 'night', anim: true, man: true, mix: false, lift: .3 };
    try {
      var q = new URLSearchParams(location.search);
      ['opt', 'cam', 'theme', 'lift'].forEach(function (k) { if (q.get(k)) state[k] = q.get(k); });
      if (q.get('anim') === '0') state.anim = false;
      if (q.get('man') === '0') state.man = false;
      if (q.get('mix') === '1') state.mix = true;
      if (q.get('nopanel') === '1') document.body.classList.add('nopanel');
      state.lift = parseFloat(state.lift); if (!(state.lift >= 0)) state.lift = .3;
    } catch (e) {}

    /* ---------------- 主题（色值与 js/gaote-scene3d.js 的 THEMES 对齐） ---------------- */
    function paint(night) {
      /* 夜里厂房白墙会被灯光打到近白（同一套 preset 的曝光与光量决定的），
         叉车要压得比墙暗两档才读得出轮廓 —— 所以夜间的黄比线上现在那版深不少 */
      return night
        ? { body: 0x8f6a17, bodyLo: 0x63490f, steel: 0x8fa0a6, steelLo: 0x4e5f66, dark: 0x162126,
            band: 0x0f1719, tyre: 0x0a1013, rim: 0x55656c, wood: 0x4b3c27, carton: 0x5a4830,
            cartonLo: 0x42351f, seat: 0x1b252a, wall: 0x8d9799, trim: 0x404a4d, base: 0x161d20 }
        : { body: 0xd9a13a, bodyLo: 0xa87c22, steel: 0xc2ccd0, steelLo: 0x8b979c, dark: 0x2c3a40,
            band: 0x232b2e, tyre: 0x1d2428, rim: 0xa8b4b8, wood: 0xa8845a, carton: 0xb8925f,
            cartonLo: 0x93744a, seat: 0x3a4750, wall: 0xe8ecee, trim: 0x8d9598, base: 0x2c3438 };
    }
    var THEMES = {
      night: { bg: 0x04090c, fog: 0x0b1c24, fogNear: 55, fogFar: 175,
        sky: [[0, '#04080c'], [.42, '#071219'], [.66, '#0d2530'], [.84, '#123743'], [1, '#17505f']],
        hemi: [0xbfe9ff, 0x0a1a1e], key: 0xcfe8ff, fill: 0x2ee6c8, win: 0xffe2bd, winI: .22 },
      day: { bg: 0xdbe9f0, fog: 0xd3e3ec, fogNear: 70, fogFar: 210,
        sky: [[0, '#2f74b8'], [.45, '#5fa6d8'], [.62, '#9ccbe4'], [.78, '#cfe2ec'], [1, '#dbe9f0']],
        hemi: [0xdff0ff, 0x76815f], key: 0xfff2d0, fill: 0xbfe0ff, win: 0xfff3e2, winI: .1 }
    };
    var PT = paint(state.theme === 'night');

    /* ---------------- 渲染器 / 相机 / 灯光 ---------------- */
    var stage = document.getElementById('stage');
    var scene = new T.Scene();
    var camera = new T.PerspectiveCamera(34, 1, .05, 400);
    var renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    SP.setupRenderer(T, renderer, state.theme);
    renderer.shadowMap.enabled = false;              /* 线上叉车本来就不投影（阴影图冻结），这里也不投 */
    stage.insertBefore(renderer.domElement, stage.firstChild);

    var PE0 = SP.env(state.theme);
    var hemi = new T.HemisphereLight(0xbfe9ff, 0x0a1a1e, PE0.lights.hemi);
    var key = new T.DirectionalLight(0xffffff, PE0.lights.key);
    var fill = new T.DirectionalLight(0x2ee6c8, PE0.lights.fill);
    key.position.set(9, 14, 7); fill.position.set(-8, 6, -6);
    scene.add(hemi, key, fill);
    var composer = null, bloomPass = null, vigPass = null, envRT = null;

    function skyTexture(stops) {
      var c = document.createElement('canvas'); c.width = 16; c.height = 256;
      var g = c.getContext('2d');
      var grd = g.createLinearGradient(0, 0, 0, 256);
      stops.forEach(function (s) { grd.addColorStop(s[0], s[1]); });
      g.fillStyle = grd; g.fillRect(0, 0, 16, 256);
      return new T.CanvasTexture(c);
    }

    /* ---------------- 小工具 ---------------- */
    function mk(c, o) {
      return new T.MeshStandardMaterial(Object.assign({ color: c, roughness: .6, metalness: .35,
        envMapIntensity: SP.env(state.theme).envInt }, o || {}));
    }
    function R(w, h, d, m, x, y, z, r) {
      var mesh = new T.Mesh(SP.roundedBoxCached(T, w, h, d, r === undefined ? .03 : r), m);
      mesh.position.set(x, y, z); return mesh;
    }
    function B(w, h, d, m, x, y, z) {
      var mesh = new T.Mesh(new T.BoxGeometry(Math.abs(w), Math.abs(h), Math.abs(d)), m);
      mesh.position.set(x, y, z); return mesh;
    }
    function CYL(rt, rb, h, seg, m, x, y, z) {
      var mesh = new T.Mesh(new T.CylinderGeometry(rt, rb, h, seg), m);
      mesh.position.set(x, y, z); return mesh;
    }
    function lit(color, x, y, z, w, h, d) {
      return B(w || .05, h || .09, d || .16,
        new T.MeshBasicMaterial({ color: color, toneMapped: false }), x, y, z);
    }
    /* 轮胎：胎体 + 轮辋 + 中心盖 + 5 颗螺栓（螺栓才让人看出轮子在滚） */
    function wheel(M, r, w, x, y, z) {
      var g = new T.Group();
      var ty = CYL(r, r, w, 22, M.tyre, 0, 0, 0); ty.rotation.x = Math.PI / 2;
      var rm = CYL(r * .6, r * .6, w * .92, 18, M.rim, 0, 0, 0); rm.rotation.x = Math.PI / 2;
      var cp = CYL(r * .22, r * .22, w * 1.04, 12, M.steelLo, 0, 0, 0); cp.rotation.x = Math.PI / 2;
      g.add(ty, rm, cp);
      for (var k = 0; k < 5; k++) {
        var a = k / 5 * Math.PI * 2;
        g.add(B(r * .13, r * .13, w * .16, M.dark, Math.cos(a) * r * .42, Math.sin(a) * r * .42, w * .5));
      }
      g.position.set(x, y, z);
      return g;
    }
    /* 并排对比时给每台顶个头牌 */
    function tag(text) {
      var c = document.createElement('canvas'); c.width = 512; c.height = 128;
      var g = c.getContext('2d');
      g.fillStyle = 'rgba(6,20,24,.82)'; g.fillRect(0, 24, 512, 80);
      g.strokeStyle = '#2ee6c8'; g.lineWidth = 4; g.strokeRect(2, 26, 508, 76);
      g.fillStyle = '#eafffa'; g.font = '600 52px "Segoe UI","Microsoft YaHei",sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 66);
      var t = new T.CanvasTexture(c);
      var s = new T.Sprite(new T.SpriteMaterial({ map: t, toneMapped: false, depthTest: false, transparent: true }));
      s.scale.set(2.2, .55, 1);
      return s;
    }

    /* ============================================================
     * 现状：js/gaote-scene3d.js 里那一台，原样复刻（含 bug）做对照
     * ============================================================ */
    function buildCurrent(M) {
      var fl = new T.Group();
      [[1.5, .5, .95, M.body, 0, .52, .06], [1.0, .55, .9, M.dark, 0, .6, -.4],
        [.9, .28, .84, M.dark, 0, .2, .05]].forEach(function (a) { fl.add(B(a[0], a[1], a[2], a[3], a[4], a[5], a[6])); });
      [[-.52, .36, .40, .16, .10], [.52, .36, .40, .16, .10],
        [-.56, .30, -.42, .13, .09], [.56, .30, -.42, .13, .09]].forEach(function (a) {
        var w = CYL(a[4], a[4], a[3], 10, M.tyre, a[0], a[1], a[2]); w.rotation.x = Math.PI / 2; fl.add(w);
      });
      /* 门架立柱：线上这里把高度 1.5 当成"材质"传进 box()，材质不是 Material
         → three 判 material.visible 为假 → 两根立柱整根不渲染，画面上只剩那根悬浮顶梁。原样照抄 */
      [[-.66, .8, .12, 1.5, .12, M.steel, 1.05, -.28], [-.66, .8, .12, 1.5, .12, M.steel, 1.05, .28]]
        .forEach(function (a) { fl.add(B(a[0], a[1], a[2], a[3], 0, a[6], a[7])); });
      fl.add(B(.1, .09, .78, M.steel, 0, 1.72, 0));
      var car = new T.Group();
      [[-.30, -.20], [-.30, .20]].forEach(function (a) { car.add(B(.85, .09, .09, M.steel, 0, .10, a[1])); });
      car.add(B(.48, .40, .56, M.wood, .12, .34, 0));
      car.position.set(-.52, .16, 0); fl.add(car);
      fl.add(lit(0xffb020, -.35, 1.62, 0, .1, .1, .1));
      return { g: fl, car: car, wheels: [], liftMax: .38 };
    }

    /* 共用的"一板货"：木托盘 + 两层纸箱 + 打包带（纸箱要压得住深色，别和白墙糊一起） */
    function palletLoad(M) {
      var g = new T.Group();
      g.add(R(1.02, .045, .96, M.wood, 0, .125, 0, .012));               /* 上面板 */
      [-.36, 0, .36].forEach(function (x) { g.add(B(.15, .075, .9, M.wood, x, .075, 0)); });
      g.add(R(1.02, .03, .96, M.wood, 0, .03, 0, .01));                   /* 下面板 */
      var strap = mk(PT.band, { roughness: .8, metalness: 0 });
      g.add(R(.94, .44, .86, M.carton, 0, .37, 0, .018));                 /* 下层纸箱 */
      [-.2, .2].forEach(function (x) { g.add(B(.035, .46, .88, strap, x, .37, 0)); });
      g.add(B(.96, .02, .035, strap, 0, .595, 0));
      g.add(R(.68, .34, .6, M.cartonLo, .04, .76, .02, .016));            /* 上层小箱 */
      g.add(B(.7, .02, .03, strap, .04, .93, .02));
      g.add(B(.02, .36, .62, strap, .04, .76, 0));
      return g;
    }
    /* 共用的 L 形货叉：竖直叉跟 + 水平叉臂 + 叉尖下倾（不是两根等截面方条） */
    function forks(M, zOff, len) {
      var g = new T.Group();
      [zOff, -zOff].forEach(function (z) {
        g.add(R(.085, .5, .125, M.steel, 0, .3, z, .02));                 /* 叉跟（竖直） */
        g.add(R(len, .07, .125, M.steel, len / 2 - .04, .035, z, .014));  /* 叉臂（水平） */
        var tip = R(.1, .05, .125, M.steelLo, len - .08, .02, z, .012);
        tip.rotation.z = -.22; g.add(tip);
      });
      return g;
    }
    /* 共用的门架：双 C 型钢立柱 + 顶横梁 + 下横梁 + 链条 */
    function mast(M, x, h, halfW) {
      var g = new T.Group(), ch = [];
      [halfW, -halfW].forEach(function (z) {
        g.add(R(.12, h, .18, M.steelLo, 0, h / 2 + .16, z, .028));
        g.add(B(.05, h - .12, .07, M.band, .075, h / 2 + .16, z));         /* C 型钢开口槽 */
        [h * .28, h * .72].forEach(function (yy) { g.add(B(.15, .05, .185, M.band, 0, yy + .16, z)); });
        var c = B(.038, h * .62, .038, M.dark, .09, h * .45, z); g.add(c); ch.push(c);
      });
      g.add(R(.14, .12, halfW * 2 + .22, M.steelLo, 0, h + .18, 0, .03));  /* 顶横梁 */
      g.add(R(.13, .09, halfW * 2 + .16, M.steelLo, 0, .22, 0, .025));
      g.position.x = x;
      return { g: g, chain: ch };
    }
    /* 共用的护顶架：四柱收细、顶板做薄并带前檐（原来那块"厚桌板"就是显丑的主因） */
    function guard(M, y0, y1, x0, x1, hw, body) {
      var g = new T.Group();
      [[x0, hw], [x0, -hw], [x1, hw], [x1, -hw]].forEach(function (a) {
        g.add(R(.07, y1 - y0, .07, body, a[0], (y0 + y1) / 2, a[1], .022));
      });
      var cx = (x0 + x1) / 2, w = (x1 - x0) + .3, d = hw * 2 + .22;
      g.add(R(w, .045, d, body, cx, y1 + .02, 0, .02));
      g.add(R(w - .1, .05, .07, M.dark, cx, y1 - .04, d / 2 - .04, .018));
      g.add(R(w - .1, .05, .07, M.dark, cx, y1 - .04, -(d / 2 - .04), .018));
      g.add(R(w - .16, .02, d - .16, M.band, cx, y1 + .05, 0, .01));
      return g;
    }
    /* 顶警示灯（半球 + 底座 + 呼吸光晕） */
    function beacon(M, x, y) {
      var g = new T.Group();
      var bm = new T.MeshBasicMaterial({ color: 0xffb020, toneMapped: false });
      var dome = new T.Mesh(new T.SphereGeometry(.075, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), bm);
      g.add(dome, CYL(.1, .115, .04, 14, bm, 0, -.01, 0));
      var halo = new T.Mesh(new T.SphereGeometry(.17, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        new T.MeshBasicMaterial({ color: 0xffb020, toneMapped: false, transparent: true, opacity: .14,
          blending: T.AdditiveBlending, depthWrite: false }));
      halo.position.y = -.02; g.add(halo);
      g.position.set(x, y, 0);
      return { g: g, halo: halo };
    }

    /* ============================================================
     * 方案1「修形」：保留现在的抽象块面语言，只把轮廓与比例修对
     * ============================================================ */
    function buildV1(M) {
      var fl = new T.Group(), wheels = [];
      fl.add(R(1.58, .44, .94, M.body, -.06, .54, 0, .06));               /* 车身 */
      fl.add(R(.7, .6, .94, M.body, -.72, .68, 0, .11));                   /* 后配重 */
      fl.add(R(1.74, .18, .96, M.dark, -.06, .28, 0, .05));                /* 下裙 */
      fl.add(B(.04, .28, .72, M.band, -.36, .78, 0));                       /* 侧缝 */
      wheels.push(wheel(M, .3, .17, .48, .3, .49), wheel(M, .3, .17, .48, .3, -.49));
      wheels.push(wheel(M, .25, .15, -.74, .25, .44), wheel(M, .25, .15, -.74, .25, -.44));
      wheels.forEach(function (w) { fl.add(w); });
      fl.add(guard(M, .76, 1.84, -.56, .3, .48, M.body));
      var mt = mast(M, .62, 2.06, .42); fl.add(mt.g);
      var car = new T.Group();
      car.add(R(.07, .66, .84, M.steel, .74, .33, 0, .028));
      var fk = forks(M, .32, 1.02); fk.position.x = .8; car.add(fk);
      var load = palletLoad(M); load.position.set(1.42, .08, 0); car.add(load);
      car.position.set(0, .2, 0); fl.add(car);
      var bc = beacon(M, -.14, 1.92); fl.add(bc.g);
      fl.add(lit(0xff4d4d, -.92, .62, .24), lit(0xff4d4d, -.92, .62, -.24));
      return { g: fl, car: car, wheels: wheels, chain: mt.chain, halo: bc.halo, liftMax: .8 };
    }

    /* ============================================================
     * 方案2「电动平衡重」：现场同款三段剪影（配重 / 驾驶舱 / 门架）
     * ============================================================ */
    function buildV2(M) {
      var fl = new T.Group(), wheels = [];
      /* 后段配重：顶面后掠 + 尾面内收，剪影不再是板砖 */
      fl.add(R(.96, .66, 1.0, M.body, -.66, .7, 0, .15));
      fl.add(R(.34, .38, .96, M.body, -1.18, .56, 0, .1));
      fl.add(B(.05, .3, .76, M.band, -1.36, .72, 0));                       /* 尾面格栅 */
      [-.16, 0, .16].forEach(function (z) { fl.add(B(.44, .04, .06, M.band, -1.02, 1.02, z)); });
      /* 底盘 + 中部电池舱 */
      fl.add(R(1.9, .19, 1.02, M.dark, -.16, .27, 0, .05));

        state.mix = true; buildAll(); setCam(state.cam); renderPanel();
      });
      var cR = document.getElementById('camRows'); cR.innerHTML = '';
      [['near', '近景 3/4'], ['side', '侧视剪影'], ['front', '正面'], ['low', '低机位'],
        ['site', '全场远机位']].forEach(function (c) {
        btn(cR, c[1], '', state.cam === c[0], function () { state.cam = c[0]; setCam(c[0]); renderPanel(); });
      });
      var eR = document.getElementById('envRows'); eR.innerHTML = '';
      btn(eR, '夜晚', '', state.theme === 'night', function () {
        state.theme = 'night'; buildAll(); renderPanel(); });
      btn(eR, '白天', '', state.theme === 'day', function () {
        state.theme = 'day'; buildAll(); renderPanel(); });
      btn(eR, state.anim ? '动画 开' : '动画 关', '行走/升降/滚轮', state.anim, function () {
        state.anim = !state.anim; renderPanel(); });
      var cur = OPTS.filter(function (o) { return o.id === state.opt; })[0];
      var html = '<b>' + cur.name + '｜' + cur.short + '</b><br>' + cur.desc;
      [['bad', '— '], ['plus', '· '], ['minus', '— ']].forEach(function (grp) {
        if (cur[grp[0]]) html += '<ul>' + cur[grp[0]].map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ul>';
      });
      document.getElementById('desc').innerHTML = html;
      document.getElementById('badgeOpt').textContent = state.mix ? '并排（现状/1/2/3）' : cur.name;
      document.getElementById('badgeSub').textContent = (state.theme === 'night' ? '夜间' : '白天') + ' · ' +
        ({ near: '近景', side: '侧视', front: '正面', low: '低机位', site: '全场' }[state.cam]);
    }

    /* ---------------- 启动 ---------------- */
    if (typeof T.OrbitControls === 'function') {
      controls = new T.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = .08;
    }
    var cp = SP.compose(T, renderer, scene, camera, state.theme,
      { width: stage.clientWidth || 900, height: stage.clientHeight || 600 });
    composer = cp.composer; bloomPass = cp.bloomPass; vigPass = cp.vigPass;
    buildAll(); renderPanel(); resize(); setCam(state.cam);
    window.addEventListener('resize', resize);
    requestAnimationFrame(loop);
    window.__FORK = function () { return { state: state, scene: scene, camera: camera,
      renderer: renderer, rigs: rigs, composer: composer }; };
  }
})();
</script>
</body>
</html>
